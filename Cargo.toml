[package]
name = "finanzhelfer-bruecke"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
chrono = "0.4.45"
fints-rs = "0.2.0"
hex = "0.4.3"
hmac = "0.12"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "charset", "http2"] }
rust_decimal = "1.43.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "signal", "process", "io-util"] }
toml = "1.1.6"
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.1", features = ["cors", "fs", "set-header"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
